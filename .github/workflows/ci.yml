name: Validate and build XBPS packages

on:
  push:
    branches: [main]
    paths:
      - "srcpkgs/**"
      - "maint/**"
      - "examples/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
      - ".gitignore"
  pull_request:
    paths:
      - "srcpkgs/**"
      - "maint/**"
      - "examples/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      package:
        description: "Select one package or all packages (x86_64-musl)"
        type: choice
        required: true
        default: none
        options:
          - none
          - all
          - aria2
          - brightnessctl
          - librewolf
          - linux7.3
          - tofi
          - velotype
          - wlsunset

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              */template) bash -n "$file" ;;
              *)
                if head -n 1 "$file" | grep -q 'bash'; then
                  bash -n "$file"
                else
                  sh -n "$file"
                fi
                ;;
            esac
          done < <(find srcpkgs maint -type f \( -name template -o -name '*.sh' \) -print0)

      - name: Validate pinned LibreWolf source fallbacks
        run: bash maint/librewolf/scripts/prepare-source-fallbacks.sh

      - name: Validate all package templates
        shell: bash
        run: |
          set -euo pipefail
          for package in aria2 brightnessctl librewolf linux7.3 tofi velotype wlsunset; do
            echo "::group::$package"
            bash "maint/$package/scripts/test-template.sh"
            echo "::endgroup::"
          done

      - name: Validate Velotype source preparation and Wayland patch
        shell: bash
        run: |
          set -euo pipefail
          bash maint/velotype/scripts/test-prepare-source.sh
          bash maint/velotype/scripts/test-wayland-patch.sh

      - name: Validate XBPS repository publisher
        run: bash maint/repository/scripts/test-publish-xbps-repository.sh

      - name: Summarize supported packages
        run: |
          {
            echo "## XBPS source package validation"
            echo
            echo "Validated seven packages for the x86_64-musl target."
            echo
            printf '%s\n' "- aria2" "- brightnessctl" "- librewolf" "- linux7.3" "- tofi" "- velotype" "- wlsunset"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.package }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package != 'none' }}
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(inputs.package == 'all' && '["aria2","brightnessctl","librewolf","linux7.3","tofi","velotype","wlsunset"]' || format('["{0}"]', inputs.package)) }}
    uses: ./.github/workflows/build-package.yml
    with:
      package: ${{ matrix.package }}
      publish: true
    secrets: inherit
