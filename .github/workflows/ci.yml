name: Validate and build XBPS packages

on:
  push:
    branches: [main]
    paths:
      - "srcpkgs/**"
      - "maint/**"
      - "examples/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
      - ".gitignore"
  pull_request:
    paths:
      - "srcpkgs/**"
      - "maint/**"
      - "examples/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      package:
        description: Select one package or all packages
        type: choice
        required: true
        default: none
        options:
          - none
          - all
          - aria2
          - brightnessctl
          - librewolf
          - linux7.3
          - tofi
          - velotype
          - wlsunset

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              */template) bash -n "$file" ;;
              *)
                if head -n 1 "$file" | grep -q 'bash'; then
                  bash -n "$file"
                else
                  sh -n "$file"
                fi
                ;;
            esac
          done < <(find srcpkgs maint -type f \( -name template -o -name '*.sh' \) -print0)

      - name: Validate pinned LibreWolf source fallbacks
        run: |
          set -euo pipefail
          fallback_dir="$(mktemp -d)"
          trap 'rm -rf -- "$fallback_dir"' EXIT
          bash maint/librewolf/scripts/prepare-source-fallbacks.sh "$fallback_dir"

      - name: Validate package templates
        shell: bash
        run: |
          set -euo pipefail
          for package in aria2 brightnessctl librewolf linux7.3 tofi velotype wlsunset; do
            echo "::group::$package"
            bash "maint/$package/scripts/test-template.sh"
            echo "::endgroup::"
          done

      - name: Validate Velotype source preparation and Wayland patch
        shell: bash
        run: |
          set -euo pipefail
          bash maint/velotype/scripts/test-prepare-source.sh
          bash maint/velotype/scripts/test-wayland-patch.sh

      - name: Validate shared build helper and package guides
        shell: bash
        run: |
          set -euo pipefail
          bash -n maint/build-package.sh
          bash maint/test-build-package.sh
          for package in aria2 brightnessctl librewolf linux7.3 tofi velotype wlsunset; do
            test -s "srcpkgs/$package/README.$package.md"
            test -s "srcpkgs/$package/template"
          done
          git diff --check

  build:
    name: Build ${{ matrix.package }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package != 'none' }}
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(inputs.package == 'all' && '["aria2","brightnessctl","librewolf","linux7.3","tofi","velotype","wlsunset"]' || format('["{0}"]', inputs.package)) }}
    uses: ./.github/workflows/build-package.yml
    with:
      package: ${{ matrix.package }}
