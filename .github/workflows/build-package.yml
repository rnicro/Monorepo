name: Build one XBPS package

on:
  workflow_call:
    inputs:
      package:
        description: Package name from srcpkgs
        type: string
        required: true

permissions:
  contents: read

env:
  XBPS_TARGET_ARCH: x86_64-musl

# Serialize builds of the same package/ref so their package caches are not written concurrently.
concurrency:
  group: xbps-build-${{ inputs.package }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out this package collection
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out upstream Void build tools
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: Record the Void source revision
        id: void-revision
        working-directory: void-packages
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # One stable key is shared by every package workflow. Bump v1 to refresh xbps-static.
      - name: Restore shared xbps-static cache
        id: xbps-static-cache
        uses: actions/cache@v4
        with:
          path: /opt/xbps
          key: xbps-static-${{ runner.os }}-x86_64-musl-v1

      - name: Download xbps-static on cache miss
        if: steps.xbps-static-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output /tmp/xbps-static.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf /tmp/xbps-static.tar.xz -C /opt/xbps
          rm -f /tmp/xbps-static.tar.xz

      - name: Add cached xbps tools to PATH
        run: |
          test -x /opt/xbps/usr/bin/xbps-install
          echo "/opt/xbps/usr/bin" >> "$GITHUB_PATH"

      # Source archives are checksum-verified by xbps-src or the package helper.
      - name: Restore package source cache
        uses: actions/cache@v4
        with:
          path: void-packages/hostdir/sources
          key: xbps-sources-${{ runner.os }}-${{ inputs.package }}-${{ hashFiles(format('srcpkgs/{0}/template', inputs.package)) }}-${{ github.run_id }}
          restore-keys: |
            xbps-sources-${{ runner.os }}-${{ inputs.package }}-

      # Binary dependencies are only reused with the same Void commit and target ABI.
      - name: Restore Void binary-package cache
        uses: actions/cache@v4
        with:
          path: void-packages/hostdir/binpkgs
          key: xbps-binpkgs-${{ runner.os }}-${{ env.XBPS_TARGET_ARCH }}-${{ steps.void-revision.outputs.commit }}-${{ github.run_id }}
          restore-keys: |
            xbps-binpkgs-${{ runner.os }}-${{ env.XBPS_TARGET_ARCH }}-${{ steps.void-revision.outputs.commit }}-

      # Velotype's Cargo registry and sccache are separate from the common Void caches.
      - name: Restore Velotype Cargo cache
        if: inputs.package == 'velotype'
        uses: actions/cache@v4
        with:
          path: |
            void-packages/hostdir/cargo/registry
            void-packages/hostdir/cargo/sccache
          key: velotype-cargo-${{ runner.os }}-${{ hashFiles('srcpkgs/velotype/template') }}-${{ github.run_id }}
          restore-keys: |
            velotype-cargo-${{ runner.os }}-${{ hashFiles('srcpkgs/velotype/template') }}-

      # LibreWolf's template uses /host/sccache and /host/pgo-cache inside xbps-src.
      - name: Restore LibreWolf compiler and PGO caches
        if: inputs.package == 'librewolf'
        uses: actions/cache@v4
        with:
          path: |
            void-packages/hostdir/sccache
            void-packages/hostdir/pgo-cache
          key: librewolf-build-${{ runner.os }}-${{ hashFiles('srcpkgs/librewolf/template', 'srcpkgs/librewolf/files/**', 'srcpkgs/librewolf/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            librewolf-build-${{ runner.os }}-${{ hashFiles('srcpkgs/librewolf/template', 'srcpkgs/librewolf/files/**', 'srcpkgs/librewolf/patches/**') }}-

      - name: Validate and build package
        env:
          PACKAGE: ${{ inputs.package }}
        run: bash maint/build-package.sh "$PACKAGE" "$GITHUB_WORKSPACE/void-packages"

      - name: Upload XBPS package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package }}-x86_64-musl
          path: dist/*.xbps
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
